name: Quenya
options:
  bundleIdPrefix: uk.co.quenya
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    QUENYA_API_BASE_URL: https://app.quenya.co.uk
targets:
  Quenya:
    type: application
    platform: iOS
    sources:
      - path: Quenya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.quenya.app
        INFOPLIST_KEY_CFBundleDisplayName: Quenya
    info:
      path: Quenya/Info.plist
      properties:
        QuenyaAPIBaseURL: $(QUENYA_API_BASE_URL)
        NSPhotoLibraryUsageDescription: Choose inspiration photos to personalise your style.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - quenya
  QuenyaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuenyaTests
    dependencies:
      - target: Quenya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.quenya.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Quenya.app/Quenya
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Quenya:
    build:
      targets:
        Quenya: all
    test:
      targets:
        - QuenyaTests

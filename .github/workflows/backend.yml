name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_DOTENV_DISABLED: '1'
      QUENYA_WARM_CACHES: '0'
      CURSOR_API_KEY: ''
      QUENYA_LLM_API_KEY: ''
      OPENAI_API_KEY: ''
      TAVILY_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff check .
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: quenya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quenya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHON_DOTENV_DISABLED: '1'
      QUENYA_WARM_CACHES: '0'
      QUENYA_AUTO_MIGRATE: '1'
      QUENYA_TEST_PG_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/quenya_test
      CURSOR_API_KEY: ''
      QUENYA_LLM_API_KEY: ''
      OPENAI_API_KEY: ''
      TAVILY_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev]'
      - run: |
          tests=(tests/test_deck_catalogue_sql.py tests/test_board_reads.py
            tests/test_admin_user_reads.py tests/test_jobs.py tests/test_migrate.py)
          if [ -f tests/test_outfit_pool_batches.py ]; then
            tests+=(tests/test_outfit_pool_batches.py)
          fi
          python -m pytest -q "${tests[@]}"
        working-directory: backend

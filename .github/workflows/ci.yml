name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      QUENYA_WARM_CACHES: "0"
      PYTHONPATH: .
      QUENYA_DATABASE_URL: ""
      QUENYA_TEST_PG_URL: ""
      CURSOR_API_KEY: ""
      QUENYA_LLM_API_KEY: ""
      TAVILY_API_KEY: ""
      OPENAI_API_KEY: ""
      QUENYA_SMTP_PASSWORD: ""
      SUPABASE_DB_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      QUENYA_R2_ACCOUNT_ID: ""
      QUENYA_R2_ACCESS_KEY_ID: ""
      QUENYA_R2_SECRET_ACCESS_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Install scraper fetchers for sport tests
        run: python -m pip install "scrapling[fetchers]"
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - name: Run Ruff
        run: ruff check .
        working-directory: backend

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quenya
          POSTGRES_PASSWORD: quenya
          POSTGRES_DB: quenya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quenya -d quenya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHON_DOTENV_DISABLED: "1"
      QUENYA_WARM_CACHES: "0"
      PYTHONPATH: .
      QUENYA_DATABASE_URL: postgresql://quenya:quenya@localhost:5432/quenya
      QUENYA_TEST_PG_URL: postgresql://quenya:quenya@localhost:5432/quenya
      CURSOR_API_KEY: ""
      QUENYA_LLM_API_KEY: ""
      TAVILY_API_KEY: ""
      OPENAI_API_KEY: ""
      QUENYA_SMTP_PASSWORD: ""
      SUPABASE_DB_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      QUENYA_R2_ACCOUNT_ID: ""
      QUENYA_R2_ACCESS_KEY_ID: ""
      QUENYA_R2_SECRET_ACCESS_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Install scraper fetchers for sport tests
        run: python -m pip install "scrapling[fetchers]"
      - name: Apply migrations and verify idempotence
        run: |
          python -m app.migrate
          second_run="$(python -m app.migrate)"
          printf '%s\n' "$second_run"
          printf '%s\n' "$second_run" | grep -qi "up to date"
        working-directory: backend
      - name: Run PostgreSQL-backed tests
        run: pytest -q tests/test_waitlist.py tests/test_deck_catalogue_sql.py
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - frontend
          - marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install dependencies and build
        run: npm ci && npm run build
        working-directory: ${{ matrix.directory }}
